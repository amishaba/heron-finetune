[project]
name = "ft"
version = "0.1.0"
description = "Auto fine-tuning pipeline: raw data in, tuned small model + honest report out."
requires-python = ">=3.12,<3.13"
dependencies = [
    "typer>=0.12",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "rich>=13.7",
    "python-dotenv>=1.0",
    "numpy>=1.26",
    "httpx>=0.27",
    "tenacity>=8.3",
    "pillow>=10.3",
    "openai>=1.40",
]

[project.optional-dependencies]
together = ["together[cli]>=2.24"]
# Fireworks trains through its Training API: the SDK plus the cookbook's supervised fine-tuning recipe.
fireworks = ["fireworks-ai[training]>=1.2.32", "fireworks-training-cookbook>=2026.11.5.1"]
hf = ["datasets>=2.20"]
# The live web demo (demo/): upload a dataset, the agent plans it, fine-tune, benchmark.
demo = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "python-multipart>=0.0.9"]
email = [
    "google-api-python-client>=2.130",
    "google-auth-oauthlib>=1.2",
    "html2text>=2024.2",
    "presidio-analyzer>=2.2",
    "presidio-anonymizer>=2.2",
    # small English model for Presidio's NER (12 MB); the default en_core_web_lg is ~560 MB
    "en_core_web_sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
]

[project.scripts]
ft = "ft.cli:app"

[dependency-groups]
dev = ["pytest>=8.2", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["ft"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: hits real paid APIs; skipped unless --live is passed"]
addopts = "-q"

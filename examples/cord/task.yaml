# CORD v2 (NAVER Clova, CC-BY-4.0): Indonesian receipt photos -> totals and line items.
# 800 / 100 / 100 predefined splits, downloaded from Hugging Face on first load (~2 GB cache).
# Base model: Qwen3.5-4B (vision-tunable on Together); Qwen3-VL-8B is no longer fine-tunable (NOTES.md).
name: cord
description: Extract totals and line items from receipt photos.
source:
  type: hf_dataset
  dataset: naver-clova-ix/cord-v2
  splits: {train: train, val: validation, test: test}
  target_map:                          # builds `target` from the ground_truth JSON column
    column: ground_truth
    root: gt_parse
    fields:
      total_price: total.total_price
      subtotal_price: sub_total.subtotal_price
      tax_price: sub_total.tax_price
      menu: {path: menu, as_list: true, item: {name: nm, count: cnt, price: price}}
task:
  type: extract
  input: {kind: image, field: image, max_side: 1280}
  output:
    field: target
    schema:
      total_price: money
      subtotal_price: money
      tax_price: money
      menu: {list_of: {name: text, count: number, price: money}}  # count: digits only ("1 x" = "1")
  instruction: Extract the receipt's totals and line items as JSON.
targets: {from: dataset}
splits: {use_predefined: true, seed: 42}
baselines:
  - {model: gpt-6-luna, reasoning_effort: low}
train: {provider: together, base_model: Qwen/Qwen3.5-4B, fallback_models: [Qwen/Qwen3.5-9B], lora: true, epochs: 3, learning_rate: 1.0e-4}
eval:
  primary_metric: field_accuracy
  pass_bar: {compare_to: best_baseline, max_gap_points: 3.0}
  concurrency: 8
budget: {max_spend_usd: 15, max_attempts: 3}
